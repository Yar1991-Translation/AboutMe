<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="yatmt">
  <!--
    The mark: the first letter of the handle, printed out of register.

    Only ONE slice is displaced. Displacing all three (and adding a vertical
    offset) broke the glyph into loose fragments instead of reading as a
    misprint — a misprint is interesting precisely because the rest of the
    plate is aligned. The two outer slices sit exactly on the letter; the
    middle one has slipped, and it is the Klein Blue one.
  -->
  <defs>
    <path id="y" d="M6.5 6.5 L16 17.5 L25.5 6.5 M16 17.5 L16 26.5"
          fill="none" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="miter"/>
    <clipPath id="s-top"><rect x="0" y="0" width="32" height="11"/></clipPath>
    <clipPath id="s-mid"><rect x="0" y="11" width="32" height="5.5"/></clipPath>
    <clipPath id="s-bot"><rect x="0" y="16.5" width="32" height="15.5"/></clipPath>
  </defs>

  <rect width="32" height="32" fill="#E8E6E1"/>

  <g clip-path="url(#s-top)">
    <use href="#y" x="-0.5" stroke="#111111"/>
  </g>
  <g clip-path="url(#s-mid)">
    <use href="#y" x="2.3" stroke="#002FA7"/>
  </g>
  <g clip-path="url(#s-bot)">
    <use href="#y" x="-0.4" stroke="#111111"/>
  </g>
</svg>
