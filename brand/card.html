<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#E8E6E1; --ink:#111111; --blue:#002FA7; --blue-ink:#002FA7;
    --line:rgba(17,17,17,.28); --line-soft:rgba(17,17,17,.12);
    --mono:"SFMono-Regular","JetBrains Mono","IBM Plex Mono",Consolas,monospace;
    --sans:"Inter","Helvetica Neue","Noto Sans SC","PingFang SC",sans-serif;
  }
  .dark {
    --bg:#111111; --ink:#E8E6E1;
    --blue-ink: color-mix(in srgb, #002FA7 52%, #ffffff);
    --line:rgba(232,230,225,.28); --line-soft:rgba(232,230,225,.12);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#555; display:flex; gap:24px; padding:24px; }
  body.solo { padding:0; gap:0; display:block; background:transparent; }

  .card {
    position:relative; width:1080px; height:1350px; flex:none;
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); overflow:hidden;
  }

  /* broken grid — real 12 columns, one rule slipped 9px, one stops short */
  .grid i { position:absolute; top:0; bottom:0; width:1px; background:var(--line-soft); }
  .grid i:nth-child(4) { background:var(--blue); opacity:.32; }
  .grid i:nth-child(8) { margin-left:9px; }
  .grid i:nth-child(11) { bottom:38%; }

  .pad { position:absolute; inset:0; padding:84px 72px 72px; display:flex; flex-direction:column; }

  .head { display:flex; align-items:flex-start; justify-content:space-between;
          border-bottom:1px solid var(--ink); padding-bottom:18px; margin-bottom:52px; }
  .mark { width:58px; height:58px; display:block; }
  .head-r { text-align:right; font-family:var(--mono); font-size:15px;
            letter-spacing:.16em; line-height:1.95; text-transform:uppercase; }
  .head-r b { color:var(--blue-ink); font-weight:400; }

  .kicker { font-family:var(--mono); font-size:15px; letter-spacing:.2em;
            text-transform:uppercase; opacity:.6; margin:118px 0 30px; }

  /* The name is ink. Only two bands are blue AND displaced — the middle third
     is left alone.
     Covering the whole glyph with blue copies turned the name into blue type
     with a fringe: the misprint was invisible because there was nothing in
     register to compare against. Same reasoning as the mark. */
  .name { font-weight:900; letter-spacing:-.02em; line-height:1.06; }
  .line { position:relative; display:block; font-size:146px; }
  .l2 { color:var(--ink); letter-spacing:-.01em; }
  .strip { position:absolute; inset:0; display:block; white-space:nowrap;
           color:var(--blue-ink); pointer-events:none; }
  .s1a { clip-path:inset(0 0 68% 0);  transform:translateX(-11px); }
  .s1c { clip-path:inset(68% 0 0 0);  transform:translateX(9px); }
  .s2a { clip-path:inset(0 0 62% 0);  transform:translateX(10px); }
  .s2b { clip-path:inset(68% 0 0 0);  transform:translateX(-9px); }

  .said { margin-top:52px; font-size:31px; line-height:1.7; opacity:.85; }
  .said b { font-weight:900; border-bottom:3px solid var(--blue); padding-bottom:3px; }

  .spacer { flex:1; display:flex; align-items:flex-start; }

  /* activates the negative space the way the site does — a measured rule with
     one Klein Blue segment, not decoration for its own sake */
  .midrule { position:relative; width:100%; margin-top:72px;
             border-top:1px solid var(--line); }
  .midrule::before { content:""; position:absolute; top:-1px; left:0;
                     width:72px; height:1px; background:var(--blue); }
  .midrule span { position:absolute; right:0; top:16px; font-family:var(--mono);
                  font-size:13px; letter-spacing:.16em; text-transform:uppercase;
                  opacity:.45; }

  .foot { border-top:1px solid var(--ink); padding-top:30px; }
  .url { display:flex; align-items:baseline; gap:18px; }
  .domain { font-size:66px; font-weight:800; letter-spacing:-.03em; }
  .domain .dot { color:var(--blue-ink); }
  .arrow { font-family:var(--mono); font-size:36px; color:var(--blue-ink); }
  .note { margin-top:20px; font-family:var(--mono); font-size:15px;
          letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
</style>
</head>
<body>

<template id="mark-light">
  <svg class="mark" viewBox="0 0 32 32">
    <defs>
      <path id="mk" d="M6.5 6.5 L16 17.5 L25.5 6.5 M16 17.5 L16 26.5" fill="none"
            stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="miter"/>
      <clipPath id="k0"><rect x="0" y="0" width="32" height="11"/></clipPath>
      <clipPath id="k1"><rect x="0" y="11" width="32" height="5.5"/></clipPath>
      <clipPath id="k2"><rect x="0" y="16.5" width="32" height="15.5"/></clipPath>
    </defs>
    <g clip-path="url(#k0)"><use href="#mk" x="-0.5" stroke="#111111"/></g>
    <g clip-path="url(#k1)"><use href="#mk" x="2.3" stroke="#002FA7"/></g>
    <g clip-path="url(#k2)"><use href="#mk" x="-0.4" stroke="#111111"/></g>
  </svg>
</template>

<script>
  // one geometry, two colourways
  const body = (stroke) => `
      <div class="grid">
        ${[72,170,268,366,464,562,660,758,856,954,1007].map(x => `<i style="left:${x}px"></i>`).join('')}
        <i style="left:1006px"></i>
      </div>
      <div class="pad">
        <div class="head">
          <svg class="mark" viewBox="0 0 32 32">
            <defs>
              <path id="mk" d="M6.5 6.5 L16 17.5 L25.5 6.5 M16 17.5 L16 26.5" fill="none"
                    stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="miter"/>
              <clipPath id="k0"><rect x="0" y="0" width="32" height="11"/></clipPath>
              <clipPath id="k1"><rect x="0" y="11" width="32" height="5.5"/></clipPath>
              <clipPath id="k2"><rect x="0" y="16.5" width="32" height="15.5"/></clipPath>
            </defs>
            <g clip-path="url(#k0)"><use href="#mk" x="-0.5" stroke="${stroke}"/></g>
            <g clip-path="url(#k1)"><use href="#mk" x="2.3" stroke="#002FA7"/></g>
            <g clip-path="url(#k2)"><use href="#mk" x="-0.4" stroke="${stroke}"/></g>
          </svg>
          <div class="head-r">
            <div><b>SUBJECT</b> / 001</div>
            <div>Bilibili — Profile</div>
          </div>
        </div>

        <div class="kicker">Hello, this is</div>

        <div class="name">
          <span class="line">是一只鸭子啊
            <span class="strip s1a" aria-hidden="true">是一只鸭子啊</span>
            <span class="strip s1c" aria-hidden="true">是一只鸭子啊</span>
          </span>
          <span class="line l2">_qwq
            <span class="strip s2a" aria-hidden="true">_qwq</span>
            <span class="strip s2b" aria-hidden="true">_qwq</span>
          </span>
        </div>

        <p class="said">叫我<b>鸭子</b>就行。</p>

        <div class="spacer">
          <div class="midrule"><span>FIG. 01 — Subject record</span></div>
        </div>

        <div class="foot">
          <div class="url">
            <span class="domain">about<span class="dot">.</span>yatmt<span class="dot">.</span>site</span>
            <span class="arrow">→</span>
          </div>
          <div class="note">更多联系方式在个人网站</div>
        </div>
      </div>`

  const light = document.createElement('div')
  light.className = 'card'; light.id = 'light'
  light.innerHTML = body('#111111')

  const dark = document.createElement('div')
  dark.className = 'card dark'; dark.id = 'dark'
  dark.innerHTML = body('#E8E6E1')

  document.body.append(light, dark)

  // ?only=light|dark isolates one card for the final render
  const only = new URLSearchParams(location.search).get('only')
  if (only) {
    document.body.classList.add('solo')
    document.querySelectorAll('.card').forEach(c => { if (c.id !== only) c.remove() })
  }
</script>
</body>
</html>
